<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/shibalogo.png" />
    <!-- アイコン集（肉球・GitHub など） -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- フォント：見出し Dela Gothic One・本文 Zen Maru Gothic・手書き風 Caveat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
      rel="stylesheet"
    />
    <title>KANEMATSU TSUBASA Portfolio</title>
    <meta
      name="description"
      content="Web エンジニア志望・兼松つばさのポートフォリオです。React・Java（Spring Boot）・PostgreSQL で作った性格診断アプリなどの作品を紹介しています。"
    />

    <!-- OGP：LINE や SNS で URL を送ったときに出る、タイトル・説明・画像 -->
    <!-- og:url と og:image は、https から始まる完全な URL で書く決まり -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KANEMATSU TSUBASA Portfolio" />
    <meta property="og:title" content="兼松つばさ｜ポートフォリオ" />
    <meta
      property="og:description"
      content="フロントからバックエンドまで作成し、AWS で公開しています。作品・スキル・プロフィールを紹介しています。"
    />
    <meta property="og:url" content="https://d2sawhxyg8rub9.cloudfront.net/" />
    <meta property="og:image" content="https://d2sawhxyg8rub9.cloudfront.net/ogp.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <!-- X（旧Twitter）用：大きい画像で表示する -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
